# Robolectric runs the Room and Paging tests on the JVM so CI needs no emulator.
#
# Pinned rather than tracking compileSdk: the framework jar is downloaded per SDK level, and letting
# it float would mean a compileSdk bump silently changes what the tests execute against. The same
# number as `:app` and `:ui` state, deliberately — three suites disagreeing about which Android they
# run on is a difference nobody would look for.
sdk=35
