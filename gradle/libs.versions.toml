[versions]
androidGradlePlugin = "9.3.1"
androidxCore = "1.19.0"
androidxLifecycle = "2.11.0"
androidxActivity = "1.13.0"
androidxBrowser = "1.10.0"
androidxComposeBom = "2026.06.00"
androidxMaterial3 = "1.5.0-alpha24"
# Where androidx's icons stopped; see `composeMultiplatformIcons` below for the freeze on both sides.
# Stated as a version here only so the multiplatform pointer, which asks for 1.7.6, does not decide it
# — the constraints at the end of `app/build.gradle.kts` are what use it.
androidxMaterialIcons = "1.7.8"
# Compose Multiplatform. Its Android artifacts are pointers: `org.jetbrains.compose.ui:ui` resolves
# to `androidx.compose.ui:ui` of the matching version, so an Android consumer ends up on exactly the
# androidx classes it was on before. Every module that compiles Compose names these coordinates now,
# `:app` included; the androidx aliases that remain below are the two test artifacts with no
# multiplatform counterpart, plus three versions held forward by constraint.
composeMultiplatform = "1.12.0-rc01"
# Material 3 is versioned on its own line in Compose Multiplatform and moves slower than the rest of
# it: this is the newest one published, and it is what `1.12.0-rc01` expects beside it. On Android it
# asks for androidx material3 1.5.0-alpha22, which loses to the alpha24 above.
composeMultiplatformMaterial3 = "1.12.0-alpha03"
# And the adaptive libraries are a third version line, `org.jetbrains.compose.material3.adaptive`.
# The newest published, and its Android pointer asks for androidx adaptive 1.3.0-beta02 — behind the
# `material3Adaptive` rc01 above, which is why that one is held forward by constraint.
composeMultiplatformAdaptive = "1.3.0-beta02"
# Frozen upstream, on both sides: androidx stopped at 1.7.8 (2025-02) and the multiplatform mirror at
# 1.7.3. The five icons this repository takes from it are Material's oldest and have not changed; the
# pin is only stated here because the version cannot come from the Compose Multiplatform line.
composeMultiplatformIcons = "1.7.3"
# The `org.jetbrains.androidx.navigation3` mirror, which is a fourth version line — see
# `compose-navigation3-ui` below for why only one of navigation3's two artifacts needs one.
composeMultiplatformNav3 = "1.1.0"
androidxTest = "1.7.0"
androidxTestExt = "1.3.0"
androidxTestRunner = "1.7.0"
androidxTestEspresso = "3.7.0"
coroutines = "1.11.0"
okio = "3.9.1"
junit = "4.13.2"
kotlin = "2.4.10"
nav3Core = "1.1.4"
material3Adaptive = "1.3.0-rc01"
okhttp = "5.4.0"
jsoup = "1.22.2"
ksoup = "0.2.6"
coil = "3.5.0"
kotlinxSerialization = "1.11.0"
# Calendar arithmetic in `commonMain`. `java.time` is what this repository used and it is not
# common; the stdlib has an instant but no time zone and no civil date, and one of the two things
# a forum needs from a calendar is "which day was this, in the site's zone".
kotlinxDatetime = "0.8.0"
# Google's material-color-utilities, ported to multiplatform Kotlin (MIT). Only the algorithm half —
# no Compose dependency of its own, so it adds a seed-to-scheme function and nothing else.
materialColorUtilities = "5.0.0"
androidxDatastore = "1.2.1"
androidxWork = "2.11.2"
# KSP dropped the `<kotlin>-<ksp>` coordinate scheme. KSP2 is versioned independently from Kotlin,
# so keep it on its own release line instead of coupling the two version numbers.
ksp = "2.3.10"
room = "2.8.4"
# androidx.sqlite, which Room 2.8.4 resolves anyway. Named on its own line because the
# multiplatform half of Room reaches it directly: a `Migration` in `commonMain` is written against
# `SQLiteConnection`, and the Apple targets need the bundled driver to have a SQLite at all.
sqlite = "2.6.2"
paging = "3.5.0"
robolectric = "4.16.1"
spotless = "8.9.0"
ktlint = "1.8.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "androidxBrowser" }
# The BOM and three artifacts are all that is still named as androidx Compose, and none of them is in
# anything that ships: what they have in common is an AndroidManifest, which is the one thing a
# multiplatform counterpart cannot carry. `ui-test-manifest` contributes the activity
# `createComposeRule` launches; `ui-test-junit4` comes along with it; `ui-tooling` is debug-only, and
# the multiplatform one declares a `PreviewActivity` whose class it does not ship — see the comment
# at that line in `app/build.gradle.kts`. The two versioned aliases after them are not dependencies at
# all — they are constraints that hold the androidx artifacts under the multiplatform pointers at the
# versions this repository is on.
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "androidxComposeBom" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4"}
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest"}
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling"}
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "androidxMaterial3" }
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core", version.ref = "androidxMaterialIcons" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTest" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExt" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidxTestEspresso" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "nav3Core" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "nav3Core" }
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "androidxLifecycle" }
androidx-material3-adaptive-navigation3 = { module = "androidx.compose.material3.adaptive:adaptive-navigation3", version.ref = "material3Adaptive" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
# DoH 设置's resolver. OkHttp's own extension artifact rather than a hand-rolled DNS-wire codec:
# `Dns` is the interface the client already takes, and this is the implementation of it Square ships.
okhttp-dnsoverhttps = { module = "com.squareup.okhttp3:okhttp-dnsoverhttps", version.ref = "okhttp" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
# jsoup's API reimplemented on Kotlin Multiplatform. The parsers moved to `:shared` are written
# against this; `:app` keeps jsoup for the HTML it still handles on the Android side.
ksoup = { module = "com.fleeksoft.ksoup:ksoup", version.ref = "ksoup" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
material-color-utilities = { module = "com.materialkolor:material-color-utilities", version.ref = "materialColorUtilities" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "androidxDatastore" }
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "androidxWork" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
# The request/interceptor half without Compose, for the module that owns the data-usage policy.
coil-core = { module = "io.coil-kt.coil3:coil-core", version.ref = "coil" }
coil-gif = { module = "io.coil-kt.coil3:coil-gif", version.ref = "coil" }
# Coil's own default never revalidates a cached image; this is the strategy that honours
# Cache-Control/ETag the way a browser does. See NodysseyApp.newImageLoader.
coil-network-cache-control = { module = "io.coil-kt.coil3:coil-network-cache-control", version.ref = "coil" }
coil-network-core = { module = "io.coil-kt.coil3:coil-network-core", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
coil-test = { module = "io.coil-kt.coil3:coil-test", version.ref = "coil" }
coil-svg = { module = "io.coil-kt.coil3:coil-svg", version.ref = "coil" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-paging = { module = "androidx.room:room-paging", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
# `SQLiteConnection` and `execSQL`, which the hand-written migrations are written against now that
# they live in `commonMain` — `SupportSQLiteDatabase` is the Android-only predecessor.
androidx-sqlite = { module = "androidx.sqlite:sqlite", version.ref = "sqlite" }
# SQLite compiled into the binary, for the targets that ship no system copy of it. Android has one
# and keeps using it — see `NodeSeekDatabaseFactory` in `androidMain` for why swapping that would
# be a behaviour change rather than a build-file change.
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
androidx-paging-runtime = { module = "androidx.paging:paging-runtime", version.ref = "paging" }
androidx-paging-compose = { module = "androidx.paging:paging-compose", version.ref = "paging" }
androidx-paging-common = { module = "androidx.paging:paging-common", version.ref = "paging" }
androidx-paging-testing = { module = "androidx.paging:paging-testing", version.ref = "paging" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

# Compose Multiplatform, for the modules that compile for more than Android. Same package names as
# androidx — `androidx.compose.material3.Button` is the same import either way — so a module switching
# to these changes its build file and not its source.
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
# `BackHandler` in `commonMain`. Its androidx counterpart does not exist as an artifact at all — the
# Android implementation ships inside `androidx.activity:activity-compose`, which is Android-only.
compose-ui-backhandler = { module = "org.jetbrains.compose.ui:ui-backhandler", version.ref = "composeMultiplatform" }
# The `@Preview` here is `androidx.compose.ui.tooling.preview.Preview` and it is common, so a preview
# in `commonMain` keeps the import it had. Not `org.jetbrains.compose.components:components-ui-tooling-preview`,
# whose `org.jetbrains.compose.ui.tooling.preview.Preview` is the deprecated predecessor of this one.
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMultiplatformMaterial3" }
# On the material3 version line rather than the main one, like `material3` itself.
compose-material3-adaptive-navigation-suite = { module = "org.jetbrains.compose.material3:material3-adaptive-navigation-suite", version.ref = "composeMultiplatformMaterial3" }
# …and this one on the adaptive line, which is a third.
compose-material3-adaptive-navigation3 = { module = "org.jetbrains.compose.material3.adaptive:adaptive-navigation3", version.ref = "composeMultiplatformAdaptive" }
compose-material-icons-core = { module = "org.jetbrains.compose.material:material-icons-core", version.ref = "composeMultiplatformIcons" }
# `NavDisplay`, and the one navigation3 half that needs a mirror: `androidx.navigation3:navigation3-ui`
# publishes android plus a jvm *stub*, while `navigation3-runtime` beside it is genuinely
# multiplatform. Found in step D1 by looking at what `:ui`'s desktop compilation resolved. Its own
# version line, one behind the androidx one it points at — see the constraint in `ui/build.gradle.kts`.
compose-navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "composeMultiplatformNav3" }
# `Res` and the string accessors generated from `composeResources/`. The Compose Multiplatform plugin
# generates the code; this is the runtime that reads the packaged resource.
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }

[plugins]
# No `android-library` alias: the library modules apply `com.android.library` through
# `plaza.android.library`, where it comes off `build-logic`'s own classpath rather than through this
# catalog. An alias nobody resolves is a version declaration that cannot be trusted to mean anything.
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Not the Compose compiler — that is the line above, and it is Kotlin's. This one generates the `Res`
# class for `composeResources/` and carries the desktop application packaging.
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
