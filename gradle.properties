# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Metaspace is stated because the default runs out once more than one module's Kotlin compiler and
# AGP are loaded in the same daemon: the build still succeeds, but the daemon is discarded afterwards
# and the next build pays full configuration cost again.
#
# The heap went 2g -> 4g when `:core` became the third module. Lint runs the Kotlin analysis API over
# every module `checkDependencies` pulls in, and at 2g `:app:lintDebug` died with an OutOfMemoryError
# inside `LLFirSessionCache` on a daemon that had already run the compile and the tests — which is
# exactly the order CI runs them in.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
# Enables Gradle Build Cache.
# See https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true
# Enables Gradle Configuration Cache, the preferred Gradle execution mode.
# See https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=true
# Modules that do not depend on each other build at the same time. Worth turning on now that the
# project is no longer a single module; the projects are decoupled, which is the precondition.
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app"s APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true

# The shipped version of the Nodyssey app.
#
# Here rather than in `app/build.gradle.kts` because `.github/workflows/release.yml` has to read it
# without running Gradle, and it used to do that by grepping `versionName = "..."` out of that build
# file. That grep is unambiguous only while exactly one module declares a version; a second
# application module would make it match whichever file the glob reached first.
#
# Prefixed by app because this repository briefly held such a second module — the bbs1org client,
# now at https://github.com/5151561/plaza. The prefix stays: `release.yml` greps for this exact key,
# and renaming it buys nothing.
nodyssey.versionCode=22
nodyssey.versionName=1.2.11-dev.1

# The Apple targets `:shared` declares only build on a Mac. Without this, configuring the build on any
# other host fails outright rather than leaving those targets unbuilt, which would make the Linux CI
# runner unable to run the Android gates at all.
#
# The cost is stated so it is not discovered: CI compiles `commonMain` for Android only. Code that
# compiles there and not for Kotlin/Native passes CI, and `./gradlew :shared:macosArm64Test` on a Mac
# is what catches it.
kotlin.native.ignoreDisabledTargets=true
