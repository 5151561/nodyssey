# See the same file in `:shared` for why the SDK level is pinned.
sdk=35

# An Application with one teardown hook, so that one test cannot wedge a Compose singleton for every
# test after it. `RobolectricApp` explains what and why; unlike `:app`'s, this one has no dependency
# graph to build — the screens here take theirs as parameters.
application=io.github.nodyssey.RobolectricApp
