# Pinned rather than tracking compileSdk: the framework jar is downloaded per SDK level, and letting
# it float would mean a compileSdk bump silently changes what the tests execute against. Same value
# as the app module's copy, deliberately.
#
# No `application=` line: RobolectricApp lives in the app module, and these tests exercise components
# that hold no application-scoped state.
sdk=35
