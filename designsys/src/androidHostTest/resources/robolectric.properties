# Pinned rather than tracking compileSdk: the framework jar is downloaded per SDK level, and letting
# it float would mean a compileSdk bump silently changes what the tests execute against. Same value
# as the app module's copy, deliberately.
#
# The `application=` line below is not `RobolectricApp` — that one lives in the app module and
# carries a teardown chore these tests do not need. This module's has one job, the locale the
# resource lookups resolve against; `DesignsysTestApp` explains why a test suite has to say so.
sdk=35
application=io.github.plaza.designsys.DesignsysTestApp
