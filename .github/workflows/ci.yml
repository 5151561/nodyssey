name: CI

# Every push to main and every pull request. The point of phase three is that a regression fails here
# rather than on someone's phone, so all four gates below are required — none of them is advisory.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push supersedes the run in flight for the same ref; only main is allowed to finish, because
  # its result is what tells us the default branch is green.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Matches the jvmToolchain(21) the convention plugins in `build-logic` set on every module.
          # A mismatch here means CI compiles against a different JDK than everyone's machine does.
          java-version: '21'

      # Deliberately not v6, and the reason is that v5 is strictly the better deal today. v6 split the
      # caching this step exists for into two providers: the default `enhanced` one is
      # `gradle-actions-caching`, proprietary and governed by Gradle's Terms of Use rather than the MIT
      # license (free for public repositories like this one, but accepting those terms is a decision,
      # not a version bump); the MIT `basic` one matches keys exactly with no fallback, so any change
      # to the dependency set re-downloads everything. v5 is that same enhanced implementation from
      # before it was extracted — MIT, no terms to accept — and it already runs on Node 24, so nothing
      # about staying here is a compromise. Revisit when v6 offers something v5 does not.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # Only main writes the shared cache, so a pull request cannot poison it for everyone else.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # There is deliberately no separate "check the lockfile" step. Dependency locking is in STRICT
      # mode, so every step below that resolves a locked classpath — unit tests, lint, assemble —
      # already fails on a dependency missing from that module's `gradle.lockfile` — there is one per
      # module now, and `plaza.dependency-locking` puts every one of them in STRICT mode:
      #
      #   > Resolved 'com.google.code.gson:gson:2.11.0' which is not part of the dependency lock state
      #
      # A `./gradlew :app:dependencies` step was tried here first and is worse than useless: it prints
      # the offending modules as FAILED and then exits 0, because `dependencies` is a report task.
      - name: Check formatting
        run: ./gradlew spotlessCheck

      # Includes the Room, Paging and Compose tests: they run on Robolectric, so no emulator is needed.
      # Unqualified so every module runs its own tests — `:app:testDebugUnitTest` would compile the
      # library modules but never execute a single test of theirs.
      #
      # `testAndroidHostTest` is the second name because `:shared` and `:designsys` are Kotlin
      # Multiplatform modules and have no build types to name a task after. Their tests are
      # `commonTest`, and this runs them on the host JVM; the Apple targets compile the same sources
      # but only on a Mac, which is why `:shared:macosArm64Test` is a local gate and not one here.
      #
      # `jvmTest` is the third, and it is a different platform rather than a second name for the same
      # one: it runs the common tests again on the desktop JVM, and it is what runs `:gallery` — the
      # module that composes `:designsys` with no Android under it at all. Without this name the
      # desktop target would be compiled and never executed, which is the failure mode step B3 exists
      # to rule out. All three names are unqualified, and a name no project defines would be an error
      # rather than a silent skip.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest testAndroidHostTest jvmTest

      # warningsAsErrors is on, so a new lint warning fails the build here. Qualified to the
      # application module because `plaza.android.application` sets `checkDependencies`, which pulls
      # every module it depends on into this one run and report — so this covers the whole repository.
      - name: Android lint
        run: ./gradlew :app:lintDebug

      - name: Assemble debug APK and optimized release bundle
        run: ./gradlew :app:assembleDebug :app:bundleRelease

      # A Room schema is checked in per version. If codegen produced a different one, the entity change
      # needs either a version bump and a migration, or a deliberate re-export — not a silent diff.
      #
      # Any module's `schemas/` directory, not `app/schemas` by name: only `:app` declares a database
      # today, and a second module that grows one must not be able to add it without this gate
      # noticing.
      #
      # `git status`, not `git diff`: a version bump writes a *new* file, and an untracked file is
      # invisible to `git diff` — the gate would have passed in silence on exactly the change it
      # exists to catch. `-uall` so a schema directory that is untracked in its entirety is listed
      # file by file rather than collapsed to a directory name the pathspec then misses.
      - name: Check the Room schema is committed
        run: |
          pending=$(git status --porcelain -uall -- '*/schemas/*')
          if [ -n "$pending" ]; then
            echo "$pending"
            git diff -- '*/schemas/*'
            echo "::error::The generated Room schema differs from the committed one." >&2
            echo "Bump the database version and export the new schema, or commit the regenerated file." >&2
            exit 1
          fi

      # Resource merging is silent about collisions: when two modules declare the same (type, name),
      # the application module's copy wins and the library's just stops being used — no error, no
      # warning, and the library file keeps looking editable. It has happened (`composer_emoji_recent`
      # was declared on both sides with only the designsys one referenced), and prefixes alone cannot
      # prevent a repeat while `composer_*` names exist in both modules. Nested `<item>` entries are
      # skipped: they only exist inside a parent (a style, an array) and never merge on their own.
      #
      # `:designsys` is no longer one of the modules this can catch, and for the better reason: its
      # strings are Compose resources now (step B3), read through a generated Kotlin object rather
      # than merged into the application's resource table, so nothing can override them silently.
      # The check stays because `:core` and `:app` still both declare `res/values`.
      - name: Check no two modules declare the same res/values resource
        run: |
          declared=$(for dir in */src/*/res/values*; do
            [ -d "$dir" ] || continue
            module="${dir%%/*}"
            grep -rhoE '<[a-z-]+ +name="[^"]+"' "$dir" \
              | sed -E 's/^<([a-z-]+) +name="([^"]+)".*/\1 \2/' \
              | grep -v '^item ' \
              | sed "s/^/$module /"
          done | sort -u)
          dups=$(echo "$declared" | awk '{print $2, $3}' | sort | uniq -d)
          if [ -n "$dups" ]; then
            echo "$declared" | grep -F "$dups"
            echo "::error::A resource name is declared by more than one module; the application module's copy silently overrides the library's." >&2
            echo "Rename one side — the library modules prefix their resources for exactly this reason." >&2
            exit 1
          fi

      - name: Upload test and lint reports
        # Reports matter most when something failed, so this runs regardless of the outcome.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            */build/reports/
            */build/test-results/
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/
          retention-days: 14
          if-no-files-found: ignore

  device-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Two invocations on one booted emulator: the debug journeys, and then `:smoke`'s startup
      # check against the R8-minified, resource-shrunk build — the variant every release ships as
      # and, until that module existed, the one no test had ever run. See `smoke/build.gradle.kts`
      # for why the minified build gets its own module instead of a deeper journey.
      - name: Run device journeys
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # The `||` block runs while the emulator is still alive — the runner tears it down when
          # the step ends, so a later `if: failure()` step would have nothing to ask. `/data/anr`
          # is where the platform writes the main-thread stacks of a wedged app, and the smoke's
          # CI-only startup timeout is exactly that shape: process up, Application done, no first
          # frame, logcat silent. The screenshot the test itself dumps says what the screen shows;
          # these traces say what the main thread was doing instead of drawing it.
          script: |
            ./gradlew :app:connectedDebugAndroidTest :smoke:connectedMinifiedAndroidTest || {
              mkdir -p device-failure-dump
              adb root >/dev/null 2>&1 || true
              adb pull /data/anr device-failure-dump/anr >/dev/null 2>&1 || true
              adb shell dumpsys activity processes > device-failure-dump/dumpsys-processes.txt 2>/dev/null || true
              adb logcat -d > device-failure-dump/logcat-full.txt 2>/dev/null || true
              exit 1
            }

      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: device-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            smoke/build/reports/androidTests/
            smoke/build/outputs/androidTest-results/
            smoke/build/outputs/connected_android_test_additional_output/
            device-failure-dump/
          retention-days: 14
          if-no-files-found: ignore
