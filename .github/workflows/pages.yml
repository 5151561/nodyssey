name: Pages

# 把 main 上的 site/ 宣传页同步到 updates 分支根目录——GitHub Pages 正从
# updates 分支（旧版“从分支部署”）服务，同一分支还托管应用内更新清单
# （stable.json / dev.json / changelog.json），所以这里只覆盖宣传页文件，
# 不动那些清单，也不切换 Pages 的部署方式。

on:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 同步 site/ 到 updates 分支
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cp -r site/. "$tmp/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch updates
          # 只覆盖宣传页文件，保留更新清单
          cp -r "$tmp"/. .
          git add index.html screenshots
          if git diff --cached --quiet; then
            echo "宣传页无变化，跳过"
            exit 0
          fi
          git commit -m "宣传页发布到 Pages 根目录（来自 ${GITHUB_SHA::7}）"
          git push origin updates
