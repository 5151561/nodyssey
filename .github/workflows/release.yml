name: Release

# Pushing a `v*` tag is the whole trigger: it builds that tag, signs it, and publishes the release.
# Nothing here reads the working tree of `main`, so a tag can be cut from any commit that deserves one.
#
# `v*` belongs to Nodyssey alone, and the shape check in the first step below is what enforces it.
# That guard was written when a second app shared this repository and needed a tag namespace of its
# own; it is kept now that it does not, because `v*` also matches things that are not releases at all
# — `v2-experiment`, a tag someone pushes to mark a branch point — and publishing a signed APK off
# one of those is the failure it actually prevents.
#
# `vX.Y.Z-dev.N` is the one other shape the guard accepts: a test build, signed and published the
# same way, but as a GitHub prerelease. `releases/latest` (what the in-app update checker reads,
# see GitHubReleaseSource.kt) excludes prereleases by construction, so a dev tag never reaches
# users who didn't go looking for it.
on:
  push:
    tags: ['v*']
  # Re-running a release by hand, for when the tag is already pushed and something below needed a fix.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v1.0.2 or v1.0.2-dev.1'
        required: true

concurrency:
  # Two runs publishing the same tag would race on the release itself.
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  # Creating the release and uploading the APK to it.
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Where the app reads its update manifests from; `NodysseyRelease.UPDATES_BASE_URL` is the
      # other end of this name.
      UPDATES_BRANCH: updates

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          # The release body ends in a compare link, and `gh` needs the tags to resolve it.
          fetch-depth: 0

      - name: Resolve the version under release
        id: version
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          # `v*` also matches `v2-experiment`, and workflow_dispatch takes whatever is typed into it —
          # including another app's tag, which would be built as Nodyssey and published under its name.
          if ! printf '%s' "$tag" | grep -qE '^v[0-9]+(\.[0-9]+)*(-dev\.[0-9]+)?$'; then
            echo "::error::$tag is not a Nodyssey release tag; those are shaped vX.Y.Z or vX.Y.Z-dev.N." >&2
            exit 1
          fi
          version="${tag#v}"
          is_dev=false
          if printf '%s' "$tag" | grep -qE -- '-dev\.[0-9]+$'; then
            is_dev=true
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "is_dev=$is_dev" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (version $version, dev=$is_dev)"

      # A tag that disagrees with the APK it would contain is worth failing over: the store listing,
      # the in-app "about" screen and the download name all read the version from different places,
      # and this is the one moment they can be compared.
      #
      # Read from `gradle.properties` rather than from a module's build file: one key, one app, and no
      # guessing about which module a future glob would have matched.
      - name: Check versionName matches the tag
        run: |
          declared=$(sed -n 's/^nodyssey\.versionName=//p' gradle.properties | head -1)
          if [ -z "$declared" ]; then
            echo "::error::gradle.properties declares no nodyssey.versionName." >&2
            exit 1
          fi
          if [ "$declared" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag ${{ steps.version.outputs.tag }} wants versionName ${{ steps.version.outputs.version }}, but gradle.properties declares $declared." >&2
            exit 1
          fi
          echo "versionName $declared matches the tag."

      # Written before anything is built, so a missing changelog section fails in seconds rather than
      # after a full release build. An empty section is treated as missing on purpose: publishing a
      # release with no notes is the failure this is meant to prevent.
      #
      # Dev tags skip this: they don't get a CHANGELOG.md entry of their own, since they're cut for
      # one-off testing rather than as a versioned step in the app's history.
      - name: Take the release notes from CHANGELOG.md
        run: |
          version="${{ steps.version.outputs.version }}"
          if [ "${{ steps.version.outputs.is_dev }}" = "true" ]; then
            echo "测试版，由 tag \`${{ steps.version.outputs.tag }}\` 构建。不是正式版本，可能不稳定。" > release-notes.md
          else
            awk -v v="$version" '
              $0 ~ "^## " v "( |$)" { inside = 1; next }
              inside && /^## / { exit }
              inside { print }
            ' CHANGELOG.md > release-notes.md
            if [ ! -s release-notes.md ] || ! grep -q '[^[:space:]]' release-notes.md; then
              echo "::error::CHANGELOG.md has no content under a '## $version' heading." >&2
              exit 1
            fi
          fi
          previous=$(git tag -l 'v*' --sort=-v:refname | grep -Fxv "${{ steps.version.outputs.tag }}" | head -1)
          if [ -n "$previous" ]; then
            {
              echo
              echo "**Full Changelog**: ${{ github.server_url }}/${{ github.repository }}/compare/$previous...${{ steps.version.outputs.tag }}"
            } >> release-notes.md
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      # Pinned to v5 for the licensing reason spelled out in ci.yml.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # A release must never be the thing that writes the shared cache.
          cache-read-only: true

      # The same gates ci.yml runs, repeated here rather than assumed: a tag can point at a commit CI
      # never saw, and "it was green on main" is not a statement about this tag. The emulator journey
      # is left to ci.yml — it needs a device and it is not what signing can get wrong.
      - name: Check formatting
        run: ./gradlew spotlessCheck

      # Unqualified so every module runs its own tests, not just `:app`.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Android lint
        run: ./gradlew :app:lintDebug

      - name: Decode the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The KEYSTORE_BASE64 secret is not set, so this release would be unsigned." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the signed release APK
        env:
          NODYSSEY_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          NODYSSEY_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          NODYSSEY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          NODYSSEY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      # Android refuses to replace an installed app with one signed by a different key, so a release
      # signed with the wrong keystore does not fail here — it fails on the phone of every existing
      # user, as "app not installed", with no way to fix it after the fact. Hence the pinned digest.
      - name: Verify the signature is the key users already trust
        env:
          EXPECTED_SHA256: '84f527d3a966f435cd32d889b8e0e267aa08b564a10df774c5159cef11e7fc6d'
        run: |
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          apk=app/build/outputs/apk/release/app-release.apk
          "$apksigner" verify --print-certs --verbose "$apk"
          actual=$("$apksigner" verify --print-certs "$apk" | grep -m1 -oE 'certificate SHA-256 digest: [0-9a-f]+' | awk '{print $NF}')
          if [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "::error::Signed with $actual, but existing installs only accept $EXPECTED_SHA256." >&2
            exit 1
          fi
          echo "Signing certificate matches the published one."

      # The `nodyssey-` prefix is load-bearing, not decoration: the in-app update check picks the asset
      # by it (`NodysseyRelease.ASSET_NAME_PREFIX`), and a release carries more than one file — a
      # mapping, a checksum — so "the .apk on the newest release" is not specific enough on its own.
      # Rename one, rename both.
      - name: Name the APK after the release
        id: apk
        run: |
          name="nodyssey-${{ steps.version.outputs.tag }}.apk"
          mv app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/$name"
          echo "path=$RUNNER_TEMP/$name" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          # `releases/latest`, which the in-app update checker reads, excludes prereleases — this
          # flag is what keeps a dev tag from reaching users who aren't specifically looking for it.
          prerelease_flag=()
          if [ "${{ steps.version.outputs.is_dev }}" = "true" ]; then
            prerelease_flag=(--prerelease)
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            # A re-run after a fix: replace the notes and the asset rather than failing on the
            # release that already exists.
            gh release edit "$tag" --title "Nodyssey $tag" --notes-file release-notes.md "${prerelease_flag[@]}"
            gh release upload "$tag" "${{ steps.apk.outputs.path }}" --clobber
          else
            gh release create "$tag" \
              --title "Nodyssey $tag" \
              --notes-file release-notes.md \
              "${prerelease_flag[@]}" \
              "${{ steps.apk.outputs.path }}"
          fi

      # What the app actually reads to learn a new build exists.
      #
      # Not `api.github.com`: its anonymous quota is 60 calls an hour per *address*, so a phone shares
      # it with everything else behind its NAT or proxy exit and meets a 403 it did not earn. These
      # three files sit on the `updates` branch instead and are read straight off
      # raw.githubusercontent.com — the same shape Sparkle's appcast and electron-builder's latest.yml
      # have. `core/update/UpdateManifestSource.kt` is the reading end.
      #
      # The branch is orphaned on purpose: it carries no source, and nothing on it is ever merged.
      - name: Publish the update manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          channel=stable
          if [ "${{ steps.version.outputs.is_dev }}" = "true" ]; then
            channel=dev
          fi
          checkout="$RUNNER_TEMP/updates"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if git clone --depth 1 --branch "$UPDATES_BRANCH" "$remote" "$checkout" 2>/dev/null; then
            echo "Updating the existing $UPDATES_BRANCH branch."
          else
            echo "No $UPDATES_BRANCH branch yet; starting one."
            git init -q -b "$UPDATES_BRANCH" "$checkout"
            git -C "$checkout" remote add origin "$remote"
          fi
          python3 .github/scripts/build-update-manifests.py \
            --tag "${{ steps.version.outputs.tag }}" \
            --version "${{ steps.version.outputs.version }}" \
            --channel "$channel" \
            --date "$(date -u +%Y-%m-%d)" \
            --repository "${{ github.repository }}" \
            --apk "${{ steps.apk.outputs.path }}" \
            --notes release-notes.md \
            --changelog CHANGELOG.md \
            --out "$checkout"
          git -C "$checkout" config user.name "github-actions[bot]"
          git -C "$checkout" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$checkout" add -A
          if git -C "$checkout" diff --cached --quiet; then
            echo "Manifests unchanged; nothing to push."
          else
            git -C "$checkout" commit -qm "Update manifests for ${{ steps.version.outputs.tag }}"
            git -C "$checkout" push -q origin "$UPDATES_BRANCH"
            echo "Pushed manifests for ${{ steps.version.outputs.tag }} on the $channel channel."
          fi

      # Dev tags are announced here too: a test build nobody hears about gets no testers, and the
      # channel is where they are. What keeps it from reading as a general release is the notes body
      # and the `-dev` in the tag heading, not silence. TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID are
      # optional: unset, this step skips instead of failing the release over a notification nobody
      # configured yet.
      - name: Notify the Telegram channel
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID not set; skipping Telegram notification."
            exit 0
          fi
          tag="${{ steps.version.outputs.tag }}"
          # Telegram caps a text message at 4096 chars; leave room for the heading built below.
          notes=$(head -c 3800 release-notes.md)
          {
            echo "Nodyssey $tag"
            echo
            echo "$notes"
          } > telegram-message.txt
          # Plain text (no parse_mode): release notes are free-form Chinese prose, and Markdown's
          # escaping rules would misparse on ordinary punctuation rather than the other way round.
          curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text@telegram-message.txt
          # The APK is a separate request, and a notification is not worth failing a release that is
          # already published: if the file is gone or unreadable, say so and stop, rather than
          # letting `curl: (26)` mark the whole run red after the release and manifests both landed.
          apk="${{ steps.apk.outputs.path }}"
          if [ ! -r "$apk" ]; then
            echo "::warning::No readable APK at $apk; the channel got the notice without the file."
            ls -l "$RUNNER_TEMP" || true
            exit 0
          fi
          curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F chat_id="${TELEGRAM_CHAT_ID}" \
            -F document=@"$apk" \
            -F caption="Nodyssey $tag"
