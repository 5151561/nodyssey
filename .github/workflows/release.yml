name: Release

# Pushing a `v*` tag is the whole trigger: it builds that tag, signs it, and publishes the release.
# Nothing here reads the working tree of `main`, so a tag can be cut from any commit that deserves one.
#
# `v*` belongs to Nodyssey alone, and the shape check in the first step below is what enforces it.
# That guard was written when a second app shared this repository and needed a tag namespace of its
# own; it is kept now that it does not, because `v*` also matches things that are not releases at all
# — `v2-experiment`, a tag someone pushes to mark a branch point — and publishing a signed APK off
# one of those is the failure it actually prevents.
#
# `vX.Y.Z-dev.N` is the one other shape the guard accepts: a test build, signed and published the
# same way, but as a GitHub prerelease. `releases/latest` (what the in-app update checker reads,
# see GitHubReleaseSource.kt) excludes prereleases by construction, so a dev tag never reaches
# users who didn't go looking for it.
on:
  push:
    tags: ['v*']
  # Re-running a release by hand, for when the tag is already pushed and something below needed a fix.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v1.0.2 or v1.0.2-dev.1'
        required: true

concurrency:
  # Two runs publishing the same tag would race on the release itself.
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  # Creating the release and uploading the APK to it.
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Read by the `ios` job below, which builds the same tag and needs the same three answers. It
    # resolves them from `steps.version` here rather than repeating the parsing, so a change to what
    # counts as a release tag is made in one place.
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      is_dev: ${{ steps.version.outputs.is_dev }}
    env:
      # Where the app reads its update manifests from; `NodysseyRelease.UPDATES_BASE_URL` is the
      # other end of this name.
      UPDATES_BRANCH: updates

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          # The release body ends in a compare link, and `gh` needs the tags to resolve it.
          fetch-depth: 0

      - name: Resolve the version under release
        id: version
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          # `v*` also matches `v2-experiment`, and workflow_dispatch takes whatever is typed into it —
          # including another app's tag, which would be built as Nodyssey and published under its name.
          if ! printf '%s' "$tag" | grep -qE '^v[0-9]+(\.[0-9]+)*(-dev\.[0-9]+)?$'; then
            echo "::error::$tag is not a Nodyssey release tag; those are shaped vX.Y.Z or vX.Y.Z-dev.N." >&2
            exit 1
          fi
          version="${tag#v}"
          is_dev=false
          if printf '%s' "$tag" | grep -qE -- '-dev\.[0-9]+$'; then
            is_dev=true
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "is_dev=$is_dev" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (version $version, dev=$is_dev)"

      # A tag that disagrees with the APK it would contain is worth failing over: the store listing,
      # the in-app "about" screen and the download name all read the version from different places,
      # and this is the one moment they can be compared.
      #
      # Read from `gradle.properties` rather than from a module's build file: one key, one app, and no
      # guessing about which module a future glob would have matched.
      - name: Check versionName matches the tag
        run: |
          declared=$(sed -n 's/^nodyssey\.versionName=//p' gradle.properties | head -1)
          if [ -z "$declared" ]; then
            echo "::error::gradle.properties declares no nodyssey.versionName." >&2
            exit 1
          fi
          if [ "$declared" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag ${{ steps.version.outputs.tag }} wants versionName ${{ steps.version.outputs.version }}, but gradle.properties declares $declared." >&2
            exit 1
          fi
          echo "versionName $declared matches the tag."

      # Written before anything is built, so a missing changelog section fails in seconds rather than
      # after a full release build. An empty section is treated as missing on purpose: publishing a
      # release with no notes is the failure this is meant to prevent.
      #
      # Dev tags have no section of their own — they aren't a versioned step in the app's history —
      # so they take the `## Unreleased` section instead: that is exactly what a test build contains,
      # and a tester who can't see what changed has nothing to look for. An empty Unreleased is fine
      # here (the notice above still says what the build is), which is why only the release branch
      # treats empty as a failure.
      - name: Take the release notes from CHANGELOG.md
        run: |
          version="${{ steps.version.outputs.version }}"
          if [ "${{ steps.version.outputs.is_dev }}" = "true" ]; then
            {
              echo "测试版，由 tag \`${{ steps.version.outputs.tag }}\` 构建。不是正式版本，可能不稳定。"
              echo
              awk '
                $0 ~ "^## Unreleased" { inside = 1; next }
                inside && /^## / { exit }
                # The blank line under the heading would stack on the one echoed above.
                inside && !started && /^[[:space:]]*$/ { next }
                inside { started = 1; print }
              ' CHANGELOG.md
            } > release-notes.md
          else
            awk -v v="$version" '
              $0 ~ "^## " v "( |$)" { inside = 1; next }
              inside && /^## / { exit }
              inside { print }
            ' CHANGELOG.md > release-notes.md
            if [ ! -s release-notes.md ] || ! grep -q '[^[:space:]]' release-notes.md; then
              echo "::error::CHANGELOG.md has no content under a '## $version' heading." >&2
              exit 1
            fi
          fi
          previous=$(git tag -l 'v*' --sort=-v:refname | grep -Fxv "${{ steps.version.outputs.tag }}" | head -1)
          if [ -n "$previous" ]; then
            {
              echo
              echo "**Full Changelog**: ${{ github.server_url }}/${{ github.repository }}/compare/$previous...${{ steps.version.outputs.tag }}"
            } >> release-notes.md
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      # Pinned to v5 for the licensing reason spelled out in ci.yml.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # A release must never be the thing that writes the shared cache.
          cache-read-only: true

      # The same gates ci.yml runs, repeated here rather than assumed: a tag can point at a commit CI
      # never saw, and "it was green on main" is not a statement about this tag. The emulator journey
      # is left to ci.yml — it needs a device and it is not what signing can get wrong.
      - name: Check formatting
        run: ./gradlew spotlessCheck

      # Unqualified so every module runs its own tests, not just `:app`.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Android lint
        run: ./gradlew :app:lintDebug

      - name: Decode the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The KEYSTORE_BASE64 secret is not set, so this release would be unsigned." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build the signed release APK
        env:
          NODYSSEY_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          NODYSSEY_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          NODYSSEY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          NODYSSEY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      # Android refuses to replace an installed app with one signed by a different key, so a release
      # signed with the wrong keystore does not fail here — it fails on the phone of every existing
      # user, as "app not installed", with no way to fix it after the fact. Hence the pinned digest.
      - name: Verify the signature is the key users already trust
        env:
          EXPECTED_SHA256: '84f527d3a966f435cd32d889b8e0e267aa08b564a10df774c5159cef11e7fc6d'
        run: |
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          apk=app/build/outputs/apk/release/app-release.apk
          "$apksigner" verify --print-certs --verbose "$apk"
          actual=$("$apksigner" verify --print-certs "$apk" | grep -m1 -oE 'certificate SHA-256 digest: [0-9a-f]+' | awk '{print $NF}')
          if [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "::error::Signed with $actual, but existing installs only accept $EXPECTED_SHA256." >&2
            exit 1
          fi
          echo "Signing certificate matches the published one."

      # The `nodyssey-` prefix is load-bearing, not decoration: the in-app update check picks the asset
      # by it (`NodysseyRelease.ASSET_NAME_PREFIX`), and a release carries more than one file — a
      # mapping, a checksum — so "the .apk on the newest release" is not specific enough on its own.
      # Rename one, rename both.
      - name: Name the APK after the release
        id: apk
        run: |
          name="nodyssey-${{ steps.version.outputs.tag }}.apk"
          mv app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/$name"
          echo "path=$RUNNER_TEMP/$name" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          # `releases/latest`, which the in-app update checker reads, excludes prereleases — this
          # flag is what keeps a dev tag from reaching users who aren't specifically looking for it.
          prerelease_flag=()
          if [ "${{ steps.version.outputs.is_dev }}" = "true" ]; then
            prerelease_flag=(--prerelease)
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            # A re-run after a fix: replace the notes and the asset rather than failing on the
            # release that already exists.
            gh release edit "$tag" --title "Nodyssey $tag" --notes-file release-notes.md "${prerelease_flag[@]}"
            gh release upload "$tag" "${{ steps.apk.outputs.path }}" --clobber
          else
            gh release create "$tag" \
              --title "Nodyssey $tag" \
              --notes-file release-notes.md \
              "${prerelease_flag[@]}" \
              "${{ steps.apk.outputs.path }}"
          fi

      # What the app actually reads to learn a new build exists.
      #
      # Not `api.github.com`: its anonymous quota is 60 calls an hour per *address*, so a phone shares
      # it with everything else behind its NAT or proxy exit and meets a 403 it did not earn. These
      # three files sit on the `updates` branch instead and are read straight off
      # raw.githubusercontent.com — the same shape Sparkle's appcast and electron-builder's latest.yml
      # have. `core/update/UpdateManifestSource.kt` is the reading end.
      #
      # The branch is orphaned on purpose: it carries no source, and nothing on it is ever merged.
      - name: Publish the update manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          channel=stable
          if [ "${{ steps.version.outputs.is_dev }}" = "true" ]; then
            channel=dev
          fi
          checkout="$RUNNER_TEMP/updates"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if git clone --depth 1 --branch "$UPDATES_BRANCH" "$remote" "$checkout" 2>/dev/null; then
            echo "Updating the existing $UPDATES_BRANCH branch."
          else
            echo "No $UPDATES_BRANCH branch yet; starting one."
            git init -q -b "$UPDATES_BRANCH" "$checkout"
            git -C "$checkout" remote add origin "$remote"
          fi
          python3 .github/scripts/build-update-manifests.py \
            --tag "${{ steps.version.outputs.tag }}" \
            --version "${{ steps.version.outputs.version }}" \
            --channel "$channel" \
            --date "$(date -u +%Y-%m-%d)" \
            --repository "${{ github.repository }}" \
            --apk "${{ steps.apk.outputs.path }}" \
            --notes release-notes.md \
            --changelog CHANGELOG.md \
            --out "$checkout"
          git -C "$checkout" config user.name "github-actions[bot]"
          git -C "$checkout" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$checkout" add -A
          if git -C "$checkout" diff --cached --quiet; then
            echo "Manifests unchanged; nothing to push."
          else
            git -C "$checkout" commit -qm "Update manifests for ${{ steps.version.outputs.tag }}"
            git -C "$checkout" push -q origin "$UPDATES_BRANCH"
            echo "Pushed manifests for ${{ steps.version.outputs.tag }} on the $channel channel."
          fi

      # Dev tags are announced here too: a test build nobody hears about gets no testers, and the
      # channel is where they are. What keeps it from reading as a general release is the notes body
      # and the `-dev` in the tag heading, not silence. TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID are
      # optional: unset, this step skips instead of failing the release over a notification nobody
      # configured yet.
      - name: Notify the Telegram channel
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID not set; skipping Telegram notification."
            exit 0
          fi
          tag="${{ steps.version.outputs.tag }}"
          # Telegram caps a text message at 4096 characters, and rejects the whole request with
          # 400 "strings must be encoded in UTF-8" if the body is not valid UTF-8. `head -c 3800`
          # counted *bytes*: on Chinese notes it both cut the text a third short and sliced a
          # character in half, which is what earned that 400 on v1.2.9-dev.4. Cut by characters.
          {
            echo "Nodyssey $tag"
            echo
            python3 -c 'import sys; sys.stdout.write(open("release-notes.md", encoding="utf-8").read()[:3800])'
          } > telegram-message.txt
          # Plain text (no parse_mode): release notes are free-form Chinese prose, and Markdown's
          # escaping rules would misparse on ordinary punctuation rather than the other way round.
          #
          # Warns rather than exits non-zero for the same reason the APK half below does: the
          # release and the manifests have already landed by here, and a notification that did not
          # go out is not worth painting the run red.
          if curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text@telegram-message.txt; then
            echo "Announced $tag in the channel."
          else
            echo "::warning::Could not announce $tag in the channel."
          fi
          # `--form-string` for everything that is not the file, `-F` only for the file itself:
          # `-F name=@value` reads `value` as a filename, and TELEGRAM_CHAT_ID holds the channel in
          # `@name` form, so `-F chat_id=...` sent curl looking for a local file called `@name` and
          # died with `curl: (26)` before it ever opened a connection. `-d` above is unaffected —
          # it only treats `@` as a file when the whole value starts with one.
          if curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            --form-string chat_id="${TELEGRAM_CHAT_ID}" \
            -F document=@"${{ steps.apk.outputs.path }}" \
            --form-string caption="Nodyssey $tag"; then
            echo "Sent the APK to the channel."
          else
            echo "::warning::Could not send the APK to the channel; the text notice went out on its own."
          fi

  # The same tag's iOS build: an unsigned `.ipa`, published beside the APK.
  #
  # Unsigned is the product, not a shortcoming of this job. Apple has no equivalent of "download an
  # APK": an app installs only if it carries a signature from a certificate the device already
  # trusts, and every such certificate belongs to one Apple Developer account. There is no key this
  # project could hold that would install on a stranger's iPhone the way the release APK does. What
  # an unsigned `.ipa` is for is re-signing — AltStore, Sideloadly, TrollStore or Xcode itself take
  # this file and sign it with the user's own account. So it is worth publishing, and worth saying
  # plainly what it is; the note this job appends to the release body is that sentence.
  #
  # A job of its own, and one that runs *after* the release rather than gating it. Two reasons, both
  # about not letting the iOS side hold the Android one hostage: this is a macOS runner doing a
  # from-scratch Kotlin/Native link of the whole app (tens of minutes, and no cache shared with the
  # Linux jobs), and the iOS shell is mid-migration — see `docs/kmp-migration-plan.md`, step D3. If
  # it breaks, the APK and the update manifests are already out; the run goes red, and the `.ipa`
  # arrives when the break is fixed and the workflow is re-run for the same tag.
  ios:
    needs: release
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      # Not decoration on an iOS build: `:iosapp` depends on `:ui` → `:designsys` → `:shared`, every
      # one of them a KMP module that also declares an Android target, so the Android Gradle plugin
      # is applied and *configuring* the build fails outright without an SDK to point at. The Linux
      # runners have one preinstalled and the macOS images do not, which is the whole reason this
      # step exists here and in neither of the other two jobs.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      # The Kotlin/Native compiler and its toolchain, which live outside `GRADLE_USER_HOME` and so
      # are not covered by the Gradle cache below. Downloading them is over a gigabyte, and it
      # happened on every run before this step existed.
      #
      # Keyed on the version catalogue because that is where the Kotlin version is declared: bump
      # Kotlin and the key changes, which is exactly when a different compiler has to be fetched.
      # Any other dependency bump changes it too — a cache miss that costs one re-download — and the
      # `restore-keys` fallback takes the last macOS entry in that case, into which Gradle downloads
      # only what is actually missing.
      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # Pinned to v5 for the licensing reason spelled out in ci.yml.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          # The one place in this workflow that writes a Gradle cache, and the exception is narrower
          # than it looks. "A release must never write the shared cache" — the rule the release job
          # above follows — is about not letting a tag build poison what every pull request reads.
          # This job cannot: `setup-gradle` puts the runner's OS in the cache key, and nothing else
          # in this repository builds on macOS, so the entry it writes has exactly one reader — the
          # next run of this job.
          #
          # Without it there is no reader at all. This job is a from-scratch Kotlin/Native build of
          # every module on a 3-core runner: 44 minutes on the first one that ran, against 4 for the
          # whole Android release beside it.
          cache-read-only: false

      # `CODE_SIGNING_ALLOWED=NO` is what makes this an unsigned build rather than a failed one:
      # the Xcode project is set to automatic signing, which on a runner with no account and no
      # provisioning profile has nothing to resolve. The three settings together tell every phase —
      # the app, and the Kotlin framework `:iosapp` embeds — to skip signing instead of looking.
      #
      # The two version settings override what `project.pbxproj` holds. `gradle.properties` is the
      # single place this app's version is declared (`nodyssey.versionCode` / `nodyssey.versionName`,
      # already checked against the tag by the release job above), and Xcode has no way to read it;
      # rather than keeping a second copy in the project file in sync, the copy in the project file
      # is left as a placeholder for local builds and the real answer is passed in here. `:shared`'s
      # `readAppVersion()` reads both back out of `Info.plist`, which is what the 关于 screen shows.
      #
      # `MARKETING_VERSION` therefore carries the `-dev.N` suffix verbatim on a dev tag. Apple's
      # guidance is three dotted integers, but that is an App Store submission rule, and this build
      # never goes near the App Store — a sideloaded `.ipa` installs with the string as written, and
      # a tester who cannot tell which dev build is on their phone is the worse outcome.
      - name: Build the unsigned app
        env:
          # Raises the Gradle daemon's heap for this job only, and it is not a precaution: at the
          # project's own `-Xmx4096m` the release link of the iOS framework dies with
          #
          #   error: Compilation failed: Java heap space
          #     at ...optimizations.StaticInitializersOptimization$InterproceduralAnalysis.analyze
          #
          # — Kotlin/Native's whole-program optimization pass, which only runs for a *release*
          # binary, which is why nothing before this job ever needed the headroom (the simulator
          # builds `docs/kmp-migration-plan.md` step D3b describes are debug ones). The Kotlin/Native
          # compiler runs inside the Gradle daemon here rather than a process of its own, so this is
          # the knob, and `kotlin.native.jvmArgs` is not.
          #
          # `GRADLE_OPTS` rather than editing a `gradle.properties`: the Gradle invocation this has
          # to reach is the one inside the Xcode project's "Build Kotlin framework" run script,
          # which takes no arguments from here.
          #
          # 5g, not more, because this runner has 7 GB in total (GitHub's macOS runners are 3-core
          # M1s) and xcodebuild wants its share. Measured at 4g fails, 5g succeeds, ~7 minutes for
          # the link. If a future version of the compiler needs more than fits, the fallback is a
          # `macos-15-intel` runner — same build, 14 GB.
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8"
        run: |
          xcodebuild \
            -project iosapp/Nodyssey.xcodeproj \
            -scheme Nodyssey \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Nodyssey.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="${{ needs.release.outputs.version }}" \
            CURRENT_PROJECT_VERSION="$(sed -n 's/^nodyssey\.versionCode=//p' gradle.properties | head -1)"

      # An `.ipa` is a zip with the `.app` under `Payload/` and nothing else required. `xcodebuild
      # -exportArchive` is the usual way to produce one and cannot be used here: export is a signing
      # step, and it refuses an archive with no signature to re-sign. Building the zip by hand is the
      # supported path for exactly this case.
      #
      # `-y` keeps symlinks as symlinks. Nothing in this bundle is a framework today — the Kotlin
      # framework is static and links in — but the flag is what stops a future embedded one from
      # being flattened into an invalid bundle.
      - name: Pack the .ipa
        id: ipa
        run: |
          name="nodyssey-${{ needs.release.outputs.tag }}.ipa"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/Nodyssey.xcarchive/Products/Applications/Nodyssey.app" "$RUNNER_TEMP/Payload/"
          (cd "$RUNNER_TEMP" && zip -qry "$name" Payload)
          echo "path=$RUNNER_TEMP/$name" >> "$GITHUB_OUTPUT"
          ls -lh "$RUNNER_TEMP/$name"

      # `--clobber` for the same reason the APK upload has it: re-running a tag replaces the asset
      # rather than failing on the one already there.
      - name: Attach the .ipa to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release.outputs.tag }}" "${{ steps.ipa.outputs.path }}" --clobber

      # Written here rather than in the release body the job above composes, because it is a claim
      # about a file: if this job failed, the release should not carry a paragraph about an `.ipa`
      # that is not attached to it. The marker check is what makes a re-run idempotent.
      #
      # Only the GitHub release body gets this. The update manifests on the `updates` branch — what
      # the in-app updater shows — are written by the job above and are the Android app's own release
      # notes; a paragraph about sideloading an iOS build has no reader there.
      - name: Say in the release notes what the .ipa is
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.release.outputs.tag }}"
          marker='### iOS（未签名，需要自己签）'
          body=$(gh release view "$tag" --json body -q .body)
          case "$body" in
            *"$marker"*)
              echo "The note is already in the body; leaving it alone."
              exit 0
              ;;
          esac
          {
            printf '%s\n' "$body"
            echo
            echo "$marker"
            echo
            echo "iOS 版还在迁移中，这个 \`.ipa\` 是测试构建，**没有签名**，双击装不上。"
            echo "需要用 AltStore、Sideloadly、TrollStore 或 Xcode，拿你自己的 Apple ID 重新签名后再装。"
            echo "免费账号签出来的有效期是 7 天，到期要重签。"
          } > release-notes-with-ios.md
          gh release edit "$tag" --notes-file release-notes-with-ios.md
          echo "Added the iOS note to $tag."

      # The channel gets the `.ipa` too, for the same reason it gets the APK: a test build nobody
      # hears about gets no testers. Its own message rather than a second attachment on the one the
      # release job sent, because this one needs a caption of its own — a file that cannot be
      # installed by tapping it, sent with no explanation, reads as a broken build.
      #
      # Sent from this job so that it goes out only when the file exists, which is the same rule the
      # release-notes step above follows.
      #
      # `--form-string` for everything that is not the file: TELEGRAM_CHAT_ID holds the channel in
      # `@name` form, and `-F chat_id=@name` sends curl looking for a local file by that name. The
      # optional-secret skip and the warn-rather-than-fail ending are both copied from the release
      # job deliberately — by here the `.ipa` is already on the release, and a notification that did
      # not go out is not worth painting the run red.
      - name: Send the .ipa to the Telegram channel
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID not set; skipping the iOS notification."
            exit 0
          fi
          tag="${{ needs.release.outputs.tag }}"
          caption="Nodyssey $tag · iOS 测试包

          这个 .ipa 没有签名，点开装不上。要用 AltStore、Sideloadly、TrollStore 或 Xcode，拿你自己的 Apple ID 重签之后再装；免费账号签出来 7 天到期，到期要重签。

          iOS 版还在迁移中，功能少于 Android 版。"
          if curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            --form-string chat_id="${TELEGRAM_CHAT_ID}" \
            -F document=@"${{ steps.ipa.outputs.path }}" \
            --form-string caption="$caption"; then
            echo "Sent the .ipa for $tag to the channel."
          else
            echo "::warning::Could not send the .ipa for $tag to the channel."
          fi
