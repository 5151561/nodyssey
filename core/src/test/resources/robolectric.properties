# Pinned rather than tracking compileSdk: the framework jar is downloaded per SDK level, and letting
# it float would mean a compileSdk bump silently changes what the tests execute against. Same value
# as the other two modules' copies, deliberately.
#
# Without this the image-policy test fails to even configure — a library module declares no
# targetSdk, so Robolectric reads compileSdk 37 and refuses anything above its own maximum.
#
# No `application=` line: nothing here holds application-scoped state.
sdk=35
